# Analyse automatique à chaque push du propriétaire du dépôt, sur toutes les branches :
#   1. lancement du projet, 2. qualité du code, 3. tests unitaires,
#   4. vulnérabilités, 5. axes d'amélioration (Claude, si le secret ANTHROPIC_API_KEY existe).
# Un push de merge sans différence avec la branche cible n'est pas analysé.
# Projets détectés automatiquement : Node (package.json), Maven (pom.xml), Python (pyproject.toml / requirements.txt).
name: Analyse du push

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: analyse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preparer:
    name: Préparation
    # Uniquement les pushs effectués par le propriétaire du dépôt
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    outputs:
      analyser: ${{ steps.push.outputs.analyser }}
      merge: ${{ steps.push.outputs.merge }}
      base: ${{ steps.push.outputs.base }}
      node: ${{ steps.projets.outputs.node }}
      maven: ${{ steps.projets.outputs.maven }}
      python: ${{ steps.projets.outputs.python }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Nature du push (merge, différences)
        id: push
        env:
          AVANT: ${{ github.event.before }}
          BRANCHE_DEFAUT: ${{ github.event.repository.default_branch }}
        run: |
          parents=$(git rev-list --parents -n 1 HEAD | wc -w)
          if [ "$parents" -gt 2 ]; then
            # Commit de merge : on compare au premier parent (la branche qui a reçu le merge)
            echo "merge=true" >> "$GITHUB_OUTPUT"
            base=$(git rev-parse HEAD^1)
          elif [ -n "$AVANT" ] && [ "$AVANT" != "0000000000000000000000000000000000000000" ] \
              && git cat-file -e "$AVANT^{commit}" 2>/dev/null; then
            echo "merge=false" >> "$GITHUB_OUTPUT"
            base=$AVANT
          else
            # Nouvelle branche ou lancement manuel : on compare à la branche par défaut
            echo "merge=false" >> "$GITHUB_OUTPUT"
            base=$(git merge-base HEAD "origin/$BRANCHE_DEFAUT" 2>/dev/null || git rev-parse HEAD^1 2>/dev/null || echo "")
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

          if [ -n "$base" ] && [ "$base" != "$(git rev-parse HEAD)" ] && git diff --quiet "$base" HEAD; then
            echo "analyser=false" >> "$GITHUB_OUTPUT"
            echo "### Aucune différence avec \`${base:0:7}\` : analyse ignorée" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "analyser=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Fichiers modifiés depuis \`${base:0:7}\`"
              echo '```'
              if [ -n "$base" ]; then git diff --stat "$base" HEAD; else git show --stat --format= HEAD; fi
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Détection des projets
        id: projets
        run: |
          lister() {
            find . -name "$1" -not -path '*/node_modules/*' -not -path '*/.git/*' -not -path '*/target/*' \
              -printf '%h\n' | sed 's#^\./##; s#^\.$#.#' | sort -u | jq -R . | jq -sc .
          }
          echo "node=$(lister package.json)" >> "$GITHUB_OUTPUT"
          echo "maven=$(lister pom.xml)" >> "$GITHUB_OUTPUT"
          python=$( { lister pyproject.toml | jq -r '.[]'; lister requirements.txt | jq -r '.[]'; } | sort -u | jq -R . | jq -sc .)
          echo "python=$python" >> "$GITHUB_OUTPUT"

  node:
    name: Node — ${{ matrix.projet }}
    needs: preparer
    if: needs.preparer.outputs.analyser == 'true' && needs.preparer.outputs.node != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        projet: ${{ fromJSON(needs.preparer.outputs.node) }}
    defaults:
      run:
        working-directory: ${{ matrix.projet }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Installation des dépendances
        id: installation
        run: |
          mkdir -p "$RUNNER_TEMP/rapport"
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Lancement du projet
        id: lancement
        if: ${{ !cancelled() && steps.installation.outcome == 'success' }}
        run: |
          npm run build --if-present 2>&1 | tee "$RUNNER_TEMP/rapport/lancement.log"
          if npm pkg get scripts.start | grep -qv '{}'; then
            # Saisie 'q' pour quitter les programmes interactifs ; un serveur toujours actif après 30 s est considéré comme lancé
            set +e
            printf 'q\n' | timeout 30 npm start 2>&1 | tee -a "$RUNNER_TEMP/rapport/lancement.log"
            code=${PIPESTATUS[1]}
            set -e
            [ "$code" -eq 0 ] || [ "$code" -eq 124 ] || exit "$code"
          fi

      - name: Qualité du code (lint, typage)
        id: qualite
        if: ${{ !cancelled() && steps.installation.outcome == 'success' }}
        run: |
          {
            if npm pkg get scripts.lint | grep -qv '{}'; then npm run lint; else echo "Aucun script 'lint'"; fi
            if npm pkg get scripts.typecheck | grep -qv '{}'; then npm run typecheck
            elif [ -f tsconfig.json ]; then npx --no-install tsc --noEmit; fi
          } 2>&1 | tee "$RUNNER_TEMP/rapport/qualite.log"
          exit "${PIPESTATUS[0]}"

      - name: Tests unitaires
        id: tests
        if: ${{ !cancelled() && steps.installation.outcome == 'success' }}
        run: |
          set -o pipefail
          if npm pkg get scripts.test:coverage | grep -qv '{}'; then
            npm run test:coverage 2>&1 | tee "$RUNNER_TEMP/rapport/tests.log"
          elif npm pkg get scripts.test | grep -qv '{}'; then
            npm test 2>&1 | tee "$RUNNER_TEMP/rapport/tests.log"
          else
            echo "Aucun test unitaire" | tee "$RUNNER_TEMP/rapport/tests.log"
          fi

      - name: Vulnérabilités (npm audit)
        id: vulnerabilites
        if: ${{ !cancelled() && steps.installation.outcome == 'success' }}
        run: |
          set -o pipefail
          npm audit 2>&1 | tee "$RUNNER_TEMP/rapport/vulnerabilites.log" || true
          # Échec uniquement pour les vulnérabilités hautes ou critiques
          npm audit --audit-level=high > /dev/null

      - name: Rapport
        if: ${{ !cancelled() }}
        env:
          PROJET: ${{ matrix.projet }}
          INSTALLATION: ${{ steps.installation.outcome }}
          LANCEMENT: ${{ steps.lancement.outcome }}
          QUALITE: ${{ steps.qualite.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          VULNERABILITES: ${{ steps.vulnerabilites.outcome }}
        run: |
          icone() { case "$1" in success) echo "✅";; failure) echo "❌";; *) echo "⏭️";; esac; }
          {
            echo "## Node — $PROJET"
            echo "| Vérification | Résultat |"
            echo "|---|---|"
            echo "| Installation | $(icone "$INSTALLATION") |"
            echo "| Lancement | $(icone "$LANCEMENT") |"
            echo "| Qualité du code | $(icone "$QUALITE") |"
            echo "| Tests unitaires | $(icone "$TESTS") |"
            echo "| Vulnérabilités | $(icone "$VULNERABILITES") |"
            if [ -f "$RUNNER_TEMP/rapport/tests.log" ]; then
              echo; echo "<details><summary>Tests</summary>"; echo; echo '```'
              grep -E '^(Tests|Test Suites):|All files|FAIL' "$RUNNER_TEMP/rapport/tests.log" || tail -n 20 "$RUNNER_TEMP/rapport/tests.log"
              echo '```'; echo "</details>"
            fi
          } | tee "$RUNNER_TEMP/rapport/resume.md" >> "$GITHUB_STEP_SUMMARY"
          echo "NOM_RAPPORT=rapport-node-$(echo "$PROJET" | tr '/.' '--')" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: ${{ env.NOM_RAPPORT }}
          path: ${{ runner.temp }}/rapport

  maven:
    name: Maven — ${{ matrix.projet }}
    needs: preparer
    if: needs.preparer.outputs.analyser == 'true' && needs.preparer.outputs.maven != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        projet: ${{ fromJSON(needs.preparer.outputs.maven) }}
    defaults:
      run:
        working-directory: ${{ matrix.projet }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Compilation et tests unitaires
        id: tests
        run: |
          mkdir -p "$RUNNER_TEMP/rapport"
          if [ -x mvnw ]; then MVN=./mvnw; else MVN=mvn; fi
          echo "MVN=$MVN" >> "$GITHUB_ENV"
          set -o pipefail
          $MVN -B verify 2>&1 | tee "$RUNNER_TEMP/rapport/tests.log"

      - name: Lancement du projet
        id: lancement
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: |
          jar=$(find target -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)
          if [ -z "$jar" ]; then echo "Aucun jar produit"; exit 0; fi
          set +e
          printf 'q\n' | timeout 30 java -jar "$jar" 2>&1 | tee "$RUNNER_TEMP/rapport/lancement.log"
          code=${PIPESTATUS[1]}
          set -e
          [ "$code" -eq 0 ] || [ "$code" -eq 124 ] || exit "$code"

      - name: Qualité du code (PMD)
        id: qualite
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          $MVN -B pmd:check -Dpmd.printFailingErrors=true 2>&1 | tee "$RUNNER_TEMP/rapport/qualite.log"

      - name: Rapport
        if: ${{ !cancelled() }}
        env:
          PROJET: ${{ matrix.projet }}
          LANCEMENT: ${{ steps.lancement.outcome }}
          QUALITE: ${{ steps.qualite.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          icone() { case "$1" in success) echo "✅";; failure) echo "❌";; *) echo "⏭️";; esac; }
          {
            echo "## Maven — $PROJET"
            echo "| Vérification | Résultat |"
            echo "|---|---|"
            echo "| Compilation et tests unitaires | $(icone "$TESTS") |"
            echo "| Lancement | $(icone "$LANCEMENT") |"
            echo "| Qualité du code (PMD) | $(icone "$QUALITE") |"
            echo "| Vulnérabilités | voir le job « Vulnérabilités (OSV) » |"
          } | tee "$RUNNER_TEMP/rapport/resume.md" >> "$GITHUB_STEP_SUMMARY"
          echo "NOM_RAPPORT=rapport-maven-$(echo "$PROJET" | tr '/.' '--')" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: ${{ env.NOM_RAPPORT }}
          path: ${{ runner.temp }}/rapport

  python:
    name: Python — ${{ matrix.projet }}
    needs: preparer
    if: needs.preparer.outputs.analyser == 'true' && needs.preparer.outputs.python != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        projet: ${{ fromJSON(needs.preparer.outputs.python) }}
    defaults:
      run:
        working-directory: ${{ matrix.projet }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Installation des dépendances
        id: installation
        run: |
          mkdir -p "$RUNNER_TEMP/rapport"
          python -m pip install --upgrade pip ruff pytest pip-audit
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e . || pip install .; fi

      - name: Lancement du projet
        id: lancement
        if: ${{ !cancelled() && steps.installation.outcome == 'success' }}
        run: |
          principal=$(ls main.py app.py __main__.py 2>/dev/null | head -n 1 || true)
          if [ -z "$principal" ]; then echo "Aucun point d'entrée (main.py, app.py, __main__.py)"; exit 0; fi
          set +e
          printf 'q\n' | timeout 30 python "$principal" 2>&1 | tee "$RUNNER_TEMP/rapport/lancement.log"
          code=${PIPESTATUS[1]}
          set -e
          [ "$code" -eq 0 ] || [ "$code" -eq 124 ] || exit "$code"

      - name: Qualité du code (ruff)
        id: qualite
        if: ${{ !cancelled() && steps.installation.outcome == 'success' }}
        run: |
          set -o pipefail
          ruff check . 2>&1 | tee "$RUNNER_TEMP/rapport/qualite.log"

      - name: Tests unitaires (pytest)
        id: tests
        if: ${{ !cancelled() && steps.installation.outcome == 'success' }}
        run: |
          set +e
          pytest 2>&1 | tee "$RUNNER_TEMP/rapport/tests.log"
          code=${PIPESTATUS[0]}
          # Code 5 : aucun test trouvé
          [ "$code" -eq 0 ] || [ "$code" -eq 5 ] || exit "$code"

      - name: Vulnérabilités (pip-audit)
        id: vulnerabilites
        if: ${{ !cancelled() && steps.installation.outcome == 'success' }}
        run: |
          set -o pipefail
          if [ -f requirements.txt ]; then pip-audit -r requirements.txt; else pip-audit; fi 2>&1 | tee "$RUNNER_TEMP/rapport/vulnerabilites.log"

      - name: Rapport
        if: ${{ !cancelled() }}
        env:
          PROJET: ${{ matrix.projet }}
          INSTALLATION: ${{ steps.installation.outcome }}
          LANCEMENT: ${{ steps.lancement.outcome }}
          QUALITE: ${{ steps.qualite.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          VULNERABILITES: ${{ steps.vulnerabilites.outcome }}
        run: |
          icone() { case "$1" in success) echo "✅";; failure) echo "❌";; *) echo "⏭️";; esac; }
          {
            echo "## Python — $PROJET"
            echo "| Vérification | Résultat |"
            echo "|---|---|"
            echo "| Installation | $(icone "$INSTALLATION") |"
            echo "| Lancement | $(icone "$LANCEMENT") |"
            echo "| Qualité du code (ruff) | $(icone "$QUALITE") |"
            echo "| Tests unitaires | $(icone "$TESTS") |"
            echo "| Vulnérabilités | $(icone "$VULNERABILITES") |"
          } | tee "$RUNNER_TEMP/rapport/resume.md" >> "$GITHUB_STEP_SUMMARY"
          echo "NOM_RAPPORT=rapport-python-$(echo "$PROJET" | tr '/.' '--')" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: ${{ env.NOM_RAPPORT }}
          path: ${{ runner.temp }}/rapport

  vulnerabilites:
    name: Vulnérabilités (OSV)
    needs: preparer
    if: needs.preparer.outputs.analyser == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Analyse des dépendances de tout le dépôt
        run: |
          mkdir -p "$RUNNER_TEMP/rapport"
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner" \
            https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          chmod +x "$RUNNER_TEMP/osv-scanner"
          set +e
          "$RUNNER_TEMP/osv-scanner" scan source -r --format markdown . > "$RUNNER_TEMP/rapport/osv.md"
          code=$?
          set -e
          { echo "## Vulnérabilités des dépendances (OSV)"; cat "$RUNNER_TEMP/rapport/osv.md"; } >> "$GITHUB_STEP_SUMMARY"
          # 0 : rien trouvé, 128 : aucun fichier de dépendances
          [ "$code" -eq 0 ] || [ "$code" -eq 128 ] || exit "$code"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: rapport-osv
          path: ${{ runner.temp }}/rapport

  ameliorations:
    name: Axes d'amélioration
    needs: [preparer, node, maven, python, vulnerabilites]
    if: ${{ !cancelled() && needs.preparer.outputs.analyser == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commentaire sur le commit analysé
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Clé Anthropic absente
        if: env.ANTHROPIC_API_KEY == ''
        run: |
          echo "Ajoutez le secret ANTHROPIC_API_KEY (Settings > Secrets and variables > Actions) pour obtenir les axes d'amélioration." \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        if: env.ANTHROPIC_API_KEY != ''
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        if: env.ANTHROPIC_API_KEY != ''
        with:
          path: ${{ runner.temp }}/rapports

      - uses: anthropics/claude-code-action@v1
        if: env.ANTHROPIC_API_KEY != ''
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --allowedTools "Read,Glob,Grep,Write,Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
          prompt: |
            Tu analyses le push ${{ github.sha }} sur la branche ${{ github.ref_name }} du dépôt ${{ github.repository }}.
            Push de merge : ${{ needs.preparer.outputs.merge }}.
            Commit de référence : ${{ needs.preparer.outputs.base }} (si vide, analyse le dernier commit).

            1. Lis les rapports des vérifications automatiques dans ${{ runner.temp }}/rapports
               (lancement, qualité, tests, vulnérabilités) et explique chaque échec.
            2. Lis les changements avec `git diff <référence> HEAD` et le code concerné.
            3. Propose des axes d'amélioration concrets et priorisés, selon le langage et le framework :
               bugs potentiels, sécurité, lisibilité, architecture, couverture de tests, performance.
               Cite les fichiers et lignes concernés.

            Écris le rapport en français, en Markdown, dans le fichier rapport-ameliorations.md à la racine.
            Ne modifie aucun autre fichier.

      - name: Publication du rapport
        if: env.ANTHROPIC_API_KEY != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f rapport-ameliorations.md ]; then echo "Aucun rapport produit"; exit 0; fi
          cat rapport-ameliorations.md >> "$GITHUB_STEP_SUMMARY"
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$(cat rapport-ameliorations.md)" > /dev/null
