<div class="resume" role="status" aria-live="polite">
  <div class="resume__textes">
    <span class="resume__date">{{ date() }}</span>
    <span class="resume__infos">{{ infos() }}</span>
  </div>
  <button type="button" class="resume__bouton" (click)="aujourdhui.emit()">Aujourd’hui</button>
</div>
